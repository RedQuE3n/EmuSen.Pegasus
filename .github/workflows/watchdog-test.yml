# TEMPORARY. This file exists to make the watchdog fail on purpose, and is
# deleted before this branch merges. It is not part of the build.
#
# The sabotage is `runs-on: ubuntu-does-not-exist`, which is what a retired image
# label looks like to Actions: not an error, just a job that is never scheduled.
# `sibling` finishes in seconds; `never-starts` sits queued. If the watchdog
# works, this run goes RED rather than sitting green-with-a-gap for 24 hours.
name: watchdog sabotage

on:
  push:
    branches: [watchdog]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sibling
            os: ubuntu-latest
          - name: never-starts
            os: ubuntu-does-not-exist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - run: echo "${{ matrix.name }} started on ${{ matrix.os }}"

  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # To cancel the run. A job that never starts never settles on its own, so
      # failing this job alone would leave the run in_progress - red inside,
      # spinning outside. Cancelling is what makes the outcome visible.
      actions: write

    steps:
      - name: Fail if a build job never starts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          # 120 rather than the 900 the real one uses, so the sabotage resolves
          # in about two minutes instead of fifteen.
          GRACE_SECONDS: '120'
        run: |
          set -uo pipefail

          while :; do
            JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
              -q '.jobs[] | select(.name | startswith("build")) | "\(.status)\t\(.completed_at // "")\t\(.name)"')

            QUEUED=$(printf '%s\n' "$JOBS" | awk -F'\t' '$1=="queued" && $3!="" {print $3}')
            DONE=$(printf '%s\n' "$JOBS" | awk -F'\t' '$1=="completed" {print $2}' | sort | tail -1)

            if [ -z "$QUEUED" ]; then
              UNFINISHED=$(printf '%s\n' "$JOBS" | awk -F'\t' '$1!="completed" && $3!="" {print $3}')
              if [ -z "$UNFINISHED" ]; then
                echo "every build job started and finished"
                exit 0
              fi
              echo "waiting: nothing queued, still running"
              sleep 15
              continue
            fi

            if [ -n "$DONE" ]; then
              AGE=$(( $(date -u +%s) - $(date -u -d "$DONE" +%s) ))
              echo "queued: $(echo $QUEUED | tr '\n' ' ') | a sibling finished ${AGE}s ago"

              if [ "$AGE" -ge "$GRACE_SECONDS" ]; then
                echo "::error::A build job has not STARTED ${AGE}s after a sibling finished."
                echo "::error::This is what a retired runner label looks like: not an error, a job nobody schedules."
                echo "::error::Still queued: $(echo $QUEUED | tr '\n' ' ')"
                gh run cancel "$RUN_ID" -R "$REPO" || true
                exit 1
              fi
            else
              echo "queued: $(echo $QUEUED | tr '\n' ' ') | no sibling has finished yet"
            fi

            sleep 15
          done
