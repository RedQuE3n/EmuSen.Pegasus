# Publish EmuSen.Pegasus.Core to NuGet.org when a core version tag is pushed.
#
#     git tag core-v0.2.0 && git push origin core-v0.2.0
#
# `core-v*` RATHER THAN `v*`, because this repository holds two things and only
# one of them is a package. The desktop application may want releases of its own
# one day, and a tag namespace decided after the fact is a tag namespace that
# collides. The prefix is stripped to get the version, so core-v0.2.0 publishes
# 0.2.0.
#
# THERE IS NO API KEY. This uses NuGet Trusted Publishing: the job asks GitHub
# for a short-lived OIDC token proving which repository and which workflow file
# is running, and nuget.org exchanges that for a key valid for a few minutes.
# Nothing long-lived is stored, so there is no secret to leak or rotate.
#
# The trust policy lives on nuget.org under Account -> Trusted Publishing and
# names four things that must match this file exactly:
#
#     Publisher          GitHub Actions
#     Repository Owner   RedQuE3n            (the GitHub LOGIN, not a person's name)
#     Repository         EmuSen.Pegasus
#     Workflow           publish-core.yml    (renaming this file breaks publishing)
#
# THE VERSION COMES FROM THE TAG, not from the fsproj. A version written in two
# places will eventually disagree with itself, and the failure mode is one this
# project has already been bitten by: NuGet caches by package id AND version, so
# repacking at a version somebody has already restored does not propagate and
# the build fails on code that was just written.
name: publish core

on:
  push:
    tags: ['core-v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    # The ceiling matters more here than anywhere else in this repository,
    # because the `dotnet test` below stands between a package and nuget.org and
    # a push cannot be taken back. A hang in that step is the safe direction to
    # fail - nothing is published - but it is indistinguishable from a slow
    # runner for six hours, and the version sits half-released while somebody
    # waits. Fifteen rather than ten: this job also packs, inspects the .nupkg
    # and exchanges an OIDC token after the suite. ci.yml carries the argument.
    timeout-minutes: 15

    permissions:
      # The whole mechanism. Without id-token: write the job cannot ask GitHub
      # for the token nuget.org wants, and the exchange fails with a bare 401.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The whole suite, not just the core's own tests. The core is the
      # vocabulary two programs agree on, so what proves it is the application
      # that speaks it - a package that was never run is a package whose first
      # user is running it for you.
      - run: dotnet test

      - name: Pack at the tagged version
        run: |
          VERSION="${GITHUB_REF_NAME#core-v}"
          echo "packing $VERSION"
          dotnet pack src/EmuSen.Pegasus.Core/EmuSen.Pegasus.Core.fsproj \
            -c Release -o nupkgs -p:Version="$VERSION"

      # THE LAST THING BETWEEN A BAD PACKAGE AND NUGET.ORG, and it exists
      # because there was nothing here when 0.2.0 and 0.2.1 went out. A push is
      # irreversible - nuget.org does not take a version back - so the check
      # that matters is the one that runs before it, on the artifact rather
      # than on the sources that produced it.
      #
      # The suite above already asserts the core declares exactly one dependency
      # and declares it itself, which is the same defect caught earlier and more
      # cheaply. This is deliberately not that test again: it opens the .nupkg
      # that is about to be uploaded and compares what it DECLARES against what
      # the project ASKED FOR. Between those two points sits `dotnet pack` and
      # this runner's SDK, which is exactly where 0.2.0 acquired a floor of
      # 10.1.302 that no file in the repository mentions.
      #
      # Nothing is hardcoded on purpose. A version written here as well as in
      # the .fsproj is a version that will eventually disagree with itself,
      # which is the trap this workflow's header already records.
      - name: Check the package declares what the project asked for
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, sys, zipfile
          import xml.etree.ElementTree as ET

          project = "src/EmuSen.Pegasus.Core/EmuSen.Pegasus.Core.fsproj"

          evaluated = subprocess.run(
              ["dotnet", "msbuild", project, "-getItem:PackageReference", "-nologo"],
              capture_output=True, text=True, check=True)
          items = json.loads(evaluated.stdout)["Items"].get("PackageReference", [])
          asked = sorted((i["Identity"], i["Version"]) for i in items)

          packages = glob.glob("nupkgs/*.nupkg")
          if len(packages) != 1:
              sys.exit(f"expected exactly one .nupkg to publish, found {packages}")

          with zipfile.ZipFile(packages[0]) as archive:
              spec = ET.fromstring(
                  archive.read(next(n for n in archive.namelist() if n.endswith(".nuspec"))))

          ns = {"n": spec.tag.split("}")[0].strip("{")}
          declared = sorted(
              (d.get("id"), d.get("version")) for d in spec.findall(".//n:dependency", ns))

          print(f"the project asks for: {asked}")
          print(f"the package declares: {declared}")

          if declared != asked:
              sys.exit(
                  "the package about to be published does not declare what the project "
                  "asked for. This is the 0.2.0 defect: the artifact varies by who built "
                  "it. Nothing has been pushed.")

          print("the package declares exactly what the project asked for")
          PY

      - name: Exchange the OIDC token for a short-lived key
        uses: NuGet/login@v1
        id: login
        with:
          user: RedQuE3n

      # --skip-duplicate so re-running a failed job is not itself a failure:
      # nuget.org will not accept a version twice, and that is the check working
      # rather than something to work around.
      - name: Push to NuGet.org
        run: |
          dotnet nuget push "nupkgs/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
